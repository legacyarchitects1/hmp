 <text x="48" y="140" fill="#ECE7DA" font-size="13" font-weight="600">1 · Stabilization</text>
 <text x="48" y="158" fill="#5A7086" font-size="10">Months 1–9 · ID, housing, health, routine</text>
 <text x="48" y="172" fill="#4A6A82" font-size="9.5">Risk-Need-Responsivity</text>

 <rect x="282" y="118" width="238" height="60" rx="8" fill="#0B1220" stroke="#29A99E" stroke-opacity=".6"/>
 <text x="296" y="140" fill="#ECE7DA" font-size="13" font-weight="600">2 · Skill Rebuilding</text>
 <text x="296" y="158" fill="#5A7086" font-size="10">Months 10–18 · literacy, numeracy, credit</text>
 <text x="296" y="172" fill="#29A99E" font-size="9.5">spaced practice + immediate feedback</text>

 <rect x="530" y="118" width="238" height="60" rx="8" fill="#0B1220" stroke="#C9A24B" stroke-opacity=".6"/>
 <text x="544" y="140" fill="#ECE7DA" font-size="13" font-weight="600">3 · Vocational Reintegration</text>
 <text x="544" y="158" fill="#5A7086" font-size="10">Months 19–27 · credentials, entity, income</text>
 <text x="544" y="172" fill="#C9A24B" font-size="9.5">credential + mentorship pairing</text>

 <rect x="778" y="118" width="248" height="60" rx="8" fill="#0B1220" stroke="#E4C173" stroke-opacity=".7"/>
 <text x="792" y="140" fill="#ECE7DA" font-size="13" font-weight="600">4 · Advanced Mastery</text>
 <text x="792" y="158" fill="#5A7086" font-size="10">Months 28–36 · assets, equity, mentoring</text>
 <text x="792" y="172" fill="#E4C173" font-size="9.5">generativity → sustained desistance</text>
</g>
