<rect x="34" y="558" width="992" height="72" rx="8" fill="#080D18" stroke="#C9A24B" stroke-opacity=".3"/>
<g font-size="10.5">
 <text x="50" y="582" fill="#4FBF7F">■ Months 1–3 drafted — objectives, 6 graded questions, 3 cognitive puzzles</text>
 <text x="50" y="602" fill="#4FBF7F">■ Months 14–20 published — PDFs linked from hmp_catalog</text>
 <text x="50" y="622" fill="#D08A3E">■ Months 4–13 and 21–36 — skeleton rows created, content pending</text>
 <text x="560" y="582" fill="#8FA3B8">Engine verified end-to-end: enrol → fail → retake → pass → unlock</text>
 <text x="560" y="602" fill="#8FA3B8">RLS on all 7 tables · catalogue public · keys and learners private</text>
 <text x="560" y="622" fill="#8FA3B8">Gating is strictly sequential — requires_month self-reference</text>
