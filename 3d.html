/* ── procedural constellation star-field ─────────────────────────────────────
   Luminous points distributed across the UPPER hemisphere only (y >= 0), with
   per-vertex colour, size attenuation and additive blending. A subset of the
   brighter stars is chained into faint constellation lines so the sky reads as
   mapped rather than random. */
function starField(count, radius, tint){
  var grp = new THREE.Group();
  var pos = new Float32Array(count*3), col = new Float32Array(count*3), siz = new Float32Array(count);
  var c = new THREE.Color(tint), w = new THREE.Color(0xFFFFFF);
  var bright = [];
  for(var i=0;i<count;i++){
    // uniform on the upper hemisphere
    var u = Math.random(), v = Math.random();
    var theta = 2*Math.PI*u;                 // azimuth
    var phi   = Math.acos(v);                // 0..PI/2 -> upper half
    var r = radius*(0.82+Math.random()*0.18);
    var x = r*Math.sin(phi)*Math.cos(theta);
    var y = r*Math.cos(phi)+3;               // lift above the horizon line
    var z = r*Math.sin(phi)*Math.sin(theta);
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;

    var mag = Math.pow(Math.random(),2.6);   // few bright, many faint
    var mix = w.clone().lerp(c, 0.25+Math.random()*0.55);
    var lum = 0.28+mag*0.72;
    col[i*3]=mix.r*lum; col[i*3+1]=mix.g*lum; col[i*3+2]=mix.b*lum;
    siz[i] = 0.55 + mag*2.9;
    if(mag>0.72 && bright.length<64) bright.push([x,y,z]);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',    new THREE.BufferAttribute(col,3));
  g.setAttribute('size',     new THREE.BufferAttribute(siz,1));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({
    size:1.5, vertexColors:true, transparent:true, opacity:.95,
    sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false
  }));
  stars.userData.twinkle = 1;
  grp.add(stars);

  // constellation chains: link each bright star to its nearest unused neighbour
  if(bright.length > 6){
    var used = {}, seg = [];
    for(var a=0;a<bright.length;a++){
      if(used[a]) continue;
      var best=-1, bd=1e9;
      for(var b=0;b<bright.length;b++){
        if(b===a||used[b]) continue;
        var dx=bright[a][0]-bright[b][0], dy=bright[a][1]-bright[b][1], dz=bright[a][2]-bright[b][2];
        var d2=dx*dx+dy*dy+dz*dz;
        if(d2<bd){bd=d2;best=b}
      }
      if(best>-1 && bd < radius*radius*0.22){
        used[a]=used[best]=1;
        seg.push(bright[a][0],bright[a][1],bright[a][2], bright[best][0],bright[best][1],bright[best][2]);
      }
    }
    if(seg.length){
      var lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
      grp.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({
        color:tint, transparent:true, opacity:.14,
        blending:THREE.AdditiveBlending, depthWrite:false
      })));
    }
  }
  return grp;
}

        new THREE.MeshStandardMaterial({color:k%3===0?0xECE7DA:k%3===1?0x29A99E:0xC9A24B,

        emissive:k%3===0?0x1A2A40:k%3===1?0x0A4040:0x4A2A00,emissiveIntensity:.4}));
      sp.position.set(p[0],hh2/2,p[1]);sp.castShadow=true;w.add(sp);
      var cl=new THREE.PointLight(k%3===1?0x29A99E:0xECE7DA,2.2,9);cl.position.set(p[0],hh2,p[1]);w.add(cl)});
    var d2=new THREE.Mesh(new THREE.CircleGeometry(6,48),glyphMat);d2.rotation.x=-Math.PI/2;d2.position.y=.04;w.add(d2);
  }
  w.visible=false;scene.add(w);return w;
}
for(var i2=0;i2<5;i2++)worlds.push(build(i2));
worlds[0].visible=true;

/* Sky domes load lazily — only the world you enter is fetched, so the first
   paint is instant instead of waiting on 18 MB of artwork. */
var skinLoaded={};
function loadSkin(k){
  if(!skinLoaded)skinLoaded={};
  if(skinLoaded[k])return; skinLoaded[k]=1;
  trySkin('tier'+k+'.png',function(t){
    t.colorSpace=THREE.sRGBEncoding||t.colorSpace;
    var dome=new THREE.Mesh(new THREE.SphereGeometry(178,40,24),
      new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,transparent:true,opacity:.95,depthWrite:false}));
    dome.rotation.y=Math.PI;
    worlds[k].add(dome);
    if(k===tier&&typeof toast==='function')toast('\u2625 '+TIERS[k].n+' rendered');
  });
}
loadSkin(0);   // safe here: both skinLoaded and loadSkin are defined above

/* oracle ring */
var oracle=new THREE.Group();
var matGold=new THREE.MeshStandardMaterial({
  color:0xC9A24B, emissive:0xC9A24B, emissiveIntensity:1.8, metalness:0.95, roughness:0.05,
  transparent:true, opacity:.92});
var matTurq=new THREE.MeshStandardMaterial({
  color:0x29A99E, emissive:0x29A99E, emissiveIntensity:1.8, metalness:0.95, roughness:0.05,
  transparent:true, opacity:.85});

var ring=new THREE.Mesh(new THREE.TorusGeometry(2.1,.13,12,64),matGold);
ring.rotation.x=Math.PI/2;oracle.add(ring);

var ring2=new THREE.Mesh(new THREE.TorusGeometry(2.62,.055,10,64),matTurq);
ring2.rotation.x=Math.PI/2;ring2.position.y=.34;oracle.add(ring2);

var ring3=new THREE.Mesh(new THREE.TorusGeometry(1.58,.045,10,56),matTurq.clone());
ring3.rotation.x=Math.PI/2;ring3.position.y=.72;oracle.add(ring3);

var orb=new THREE.Mesh(new THREE.SphereGeometry(.52,24,18),
  new THREE.MeshStandardMaterial({color:0xE4C173,emissive:0xE4C173,emissiveIntensity:2.4,
    metalness:0.95,roughness:0.05}));
orb.position.y=1.6;oracle.add(orb);

var halo=new THREE.Mesh(new THREE.SphereGeometry(.78,20,16),
  new THREE.MeshBasicMaterial({color:0x29A99E,transparent:true,opacity:.13,
    blending:THREE.AdditiveBlending,depthWrite:false}));
halo.position.y=1.6;oracle.add(halo);

var pad=new THREE.Mesh(new THREE.CircleGeometry(2.1,64),
  new THREE.MeshStandardMaterial({map:texGlyph,emissive:0xC9A24B,emissiveIntensity:.65,
    metalness:.85,roughness:.12,transparent:true,opacity:.8}));
pad.rotation.x=-Math.PI/2;pad.position.y=.03;oracle.add(pad);

oracle.add(new THREE.PointLight(0xC9A24B,3.8,12));
var tq=new THREE.PointLight(0x29A99E,2.2,9);tq.position.y=1.6;oracle.add(tq);
oracle.position.set(0,0,-9);scene.add(oracle);

var me=avatar(COL[myIdx]);me.position.set(0,0,7);scene.add(me);
var others={};

/* ── state ───────────────────────────────────────────────────────────────── */
var tier=0,ankh=+(localStorage.getItem('pmk_ankh')||50);
var yaw=0,pitch=.42,dir={x:0,z:0},near=false,busy=false;
document.getElementById('me').textContent=myName;
function setAnkh(v){ankh=v;localStorage.setItem('pmk_ankh',v);document.getElementById('ankh').textContent=v.toLocaleString()+' ☥'}
setAnkh(ankh);
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0},2300)}
function earn(n,why){setAnkh(ankh+n);toast('+'+n+' ☥ '+why)}

var rail=document.getElementById('rail');
TIERS.forEach(function(t,i){var b=document.createElement('button');b.textContent=['☽','⊛','◈','☀','♦'][i]+' '+t.n.split(' ')[0];
  b.onclick=function(){go(i)};rail.appendChild(b)});
function paintRail(){[].forEach.call(rail.children,function(b,i){b.className=i===tier?'on':''})}
function go(i){
  worlds.forEach(function(w,k){w.visible=k===i});
  scene.fog=new THREE.FogExp2(TIERS[i].fog,TIERS[i].d);rend.setClearColor(TIERS[i].bg);
  if(i>tier)earn(i*500,'Ascended');
  tier=i;document.getElementById('tier').textContent=TIERS[i].n;paintRail();
  loadSkin(i);
  say(LORE[i]);
  me.position.set(0,0,7);
  for(var k in others)others[k].g.visible=others[k].tier===i;
}
function cyc(){go((tier+1)%5)}
paintRail();scene.fog=new THREE.FogExp2(TIERS[0].fog,TIERS[0].d);rend.setClearColor(TIERS[0].bg);

/* ── joystick + look ─────────────────────────────────────────────────────── */
var joy=document.getElementById('joy'),nub=document.getElementById('nub'),jid=null,jo={x:0,y:0};
joy.addEventListener('touchstart',function(e){var t=e.changedTouches[0];jid=t.identifier;jo={x:t.clientX,y:t.clientY};e.preventDefault()},{passive:false});
addEventListener('touchmove',function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
    if(t.identifier===jid){var dx=(t.clientX-jo.x)/52,dy=(t.clientY-jo.y)/52;
      dx=Math.max(-1,Math.min(1,dx));dy=Math.max(-1,Math.min(1,dy));dir={x:dx,z:dy};
      nub.style.transform='translate('+dx*30+'px,'+dy*30+'px)';e.preventDefault()}
    else if(jid!==null||e.touches.length){ // second finger = look
      if(t.identifier!==jid&&t._px!==undefined){yaw-=(t.clientX-t._px)*.006;pitch=Math.max(.12,Math.min(1.35,pitch-(t.clientY-t._py)*.005))}
      t._px=t.clientX;t._py=t.clientY}}
},{passive:false});
addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++)
  if(e.changedTouches[i].identifier===jid){jid=null;dir={x:0,z:0};nub.style.transform='none'}});
/* single-finger drag anywhere else = look */
var lx=null,ly=null;
addEventListener('touchstart',function(e){if(e.target.closest('#joy,#act,#panel,#rail'))return;
  var t=e.touches[e.touches.length-1];lx=t.clientX;ly=t.clientY});
addEventListener('touchmove',function(e){if(lx===null)return;if(e.target.closest('#joy,#act,#panel,#rail'))return;
  var t=e.touches[e.touches.length-1];yaw-=(t.clientX-lx)*.006;pitch=Math.max(.12,Math.min(1.35,pitch-(t.clientY-ly)*.005));
  lx=t.clientX;ly=t.clientY},{passive:false});
addEventListener('touchend',function(){lx=null});
/* keyboard for desktop */
var keys={};onkeydown=function(e){keys[e.code]=1};onkeyup=function(e){delete keys[e.code]};
var md=false,mx=0,my=0;
addEventListener('mousedown',function(e){if(e.target.closest('#panel,#act,#rail'))return;md=true;mx=e.clientX;my=e.clientY});
addEventListener('mouseup',function(){md=false});
addEventListener('mousemove',function(e){if(!md)return;yaw-=(e.clientX-mx)*.005;
  pitch=Math.max(.12,Math.min(1.35,pitch-(e.clientY-my)*.004));mx=e.clientX;my=e.clientY});

/* ── multiplayer ─────────────────────────────────────────────────────────── */
var ws=null,wsOK=false;
function connect(){
  try{ws=new WebSocket('wss://'+SB.replace('https://','')+'/realtime/v1/websocket?apikey='+KEY+'&vsn=1.0.0')}catch(e){return}
  ws.onopen=function(){wsOK=true;
    ws.send(JSON.stringify({topic:'realtime:pmk',event:'phx_join',payload:{config:{broadcast:{self:false}}},ref:'1'}));
    setInterval(function(){if(ws.readyState===1)ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'h'}))},25000)};
  ws.onmessage=function(ev){try{var m=JSON.parse(ev.data);
    if(m.event==='broadcast'&&m.payload&&m.payload.event==='mv'){var p=m.payload.payload;
      if(!p||p.id===myId)return;
      if(!others[p.id]){var idx=Object.keys(others).length%COL.length;var g=avatar(COL[idx]);scene.add(g);others[p.id]={g:g,tier:p.t,last:Date.now()}}
      var o=others[p.id];o.g.position.set(p.x,0,p.z);o.g.rotation.y=p.r||0;o.tier=p.t;o.last=Date.now();
      o.g.visible=(p.t===tier);
      document.getElementById('pop').textContent='👥 '+(1+Object.keys(others).length)}
  }catch(e){}};
  ws.onclose=function(){wsOK=false;setTimeout(connect,4000)};
}
connect();
setInterval(function(){ // prune stale players
  var now=Date.now();for(var k in others)if(now-others[k].last>15000){scene.remove(others[k].g);delete others[k]}
  document.getElementById('pop').textContent='👥 '+(1+Object.keys(others).length);
},6000);

/* ── oracle ──────────────────────────────────────────────────────────────── */
function openO(){document.getElementById('panel').style.display='block';document.getElementById('q').focus()}
function closeO(){document.getElementById('panel').style.display='none';stopSay()}
function qk(t){document.getElementById('q').value=t;ask()}
function ask(){
  var q=document.getElementById('q').value.trim();if(!q||busy)return;busy=true;
  var r=document.getElementById('resp');r.style.display='block';r.textContent='☥ Consulting Tahuti Prime…';
  fetch(SB+'/rest/v1/rpc/oracle_ask',{method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({question:q})})
   .then(function(x){if(!x.ok)throw new Error('HTTP '+x.status);return x.json()})
   .then(function(d){
     var txt=Array.isArray(d)?(d[0]&&(d[0].answer||d[0].oracle_ask)):(d&&d.answer);
     txt=txt||'The oracle is silent.';
     r.textContent=txt;
     document.getElementById('q').value='';
     earn(50,'Oracle');
     say(txt);
   })
   .catch(function(e){r.textContent='Oracle unreachable: '+e.message})
   .then(function(){busy=false});
}

/* ── voice-over: browser speech synthesis, no key, works offline ─────────── */
var SS=(typeof speechSynthesis!=='undefined')?speechSynthesis:((typeof window!=='undefined'&&window.speechSynthesis)?window.speechSynthesis:null);
var voiceOn=(localStorage.getItem('pmk_voice')!=='0'), pickedVoice=null;
function loadVoices(){
  if(!SS)return;
  var vs=SS.getVoices()||[];
  var pref=['Google UK English Male','Microsoft Guy','Daniel','Google US English','Alex'];
  for(var i=0;i<pref.length&&!pickedVoice;i++)
    for(var j=0;j<vs.length;j++) if(vs[j].name.indexOf(pref[i])>-1){pickedVoice=vs[j];break}
  if(!pickedVoice&&vs.length) pickedVoice=vs.filter(function(v){return v.lang.indexOf('en')===0})[0]||vs[0];
}
if(SS){loadVoices();SS.onvoiceschanged=loadVoices}
function say(t){
  if(!voiceOn||!SS||!t)return;
  SS.cancel();
  // split into sentences so it starts fast and can be interrupted
  var parts=t.replace(/\s+/g,' ').match(/[^.!?]+[.!?]?/g)||[t];
  parts.forEach(function(p){
    if(!p.trim())return;
    if(typeof SpeechSynthesisUtterance==='undefined')return;
    var u=new SpeechSynthesisUtterance(p.trim());
    if(pickedVoice)u.voice=pickedVoice;
    u.rate=.95;u.pitch=.85;u.volume=1;
    SS.speak(u);
  });
}
function stopSay(){if(SS)SS.cancel()}
function toggleVoice(){
  voiceOn=!voiceOn;localStorage.setItem('pmk_voice',voiceOn?'1':'0');
  document.getElementById('vbtn').textContent=voiceOn?'🔊 VOICE ON':'🔇 VOICE OFF';
  if(!voiceOn)stopSay(); else say('Voice enabled. Tahuti Prime will read the teachings aloud.');
}

/* ── loop ────────────────────────────────────────────────────────────────── */
var clock=new THREE.Clock(),bcast=0;
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
  var dx=dir.x,dz=dir.z;
  if(keys.KeyW||keys.ArrowUp)dz=-1; if(keys.KeyS||keys.ArrowDown)dz=1;
  if(keys.KeyA||keys.ArrowLeft)dx=-1; if(keys.KeyD||keys.ArrowRight)dx=1;

  var mag=Math.sqrt(dx*dx+dz*dz);
  if(mag>.14){
    var wx=dx*Math.cos(yaw)+dz*Math.sin(yaw), wz=dx*Math.sin(yaw)-dz*Math.cos(yaw);
    var L=Math.sqrt(wx*wx+wz*wz), sp=7.4;
    me.position.x=Math.max(-52,Math.min(52,me.position.x+wx/L*sp*dt));
    me.position.z=Math.max(-52,Math.min(52,me.position.z+wz/L*sp*dt));
    me.rotation.y=Math.atan2(wx,wz);
    var sw=Math.sin(T*9)*.34, u=me.userData;
    u.legs[0].rotation.x=sw;u.legs[1].rotation.x=-sw;
    u.arms[0].rotation.x=-sw*.8;u.arms[1].rotation.x=sw*.8;
  }else{var u2=me.userData;u2.legs[0].rotation.x*=.8;u2.legs[1].rotation.x*=.8;
    u2.arms[0].rotation.x*=.8;u2.arms[1].rotation.x*=.8}

  var D=9.4;
  cam.position.lerp(new THREE.Vector3(
    me.position.x+D*Math.sin(yaw)*Math.cos(pitch),
    me.position.y+D*Math.sin(pitch)+1.4,
    me.position.z+D*Math.cos(yaw)*Math.cos(pitch)),.12);
  cam.lookAt(me.position.x,me.position.y+1.25,me.position.z);

  var dOr=me.position.distanceTo(oracle.position);
  var nowNear=dOr<4.6;
  if(nowNear!==near){near=nowNear;document.getElementById('hint').style.display=near?'block':'none';
    if(near)document.getElementById('hint').textContent='Tap ☥ ORACLE to consult Tahuti'}

  ring.rotation.z+=.021; ring2.rotation.z-=.014; ring3.rotation.z+=.028;
  orb.position.y=1.6+Math.sin(T*1.9)*.26; halo.position.y=orb.position.y;
  halo.scale.setScalar(1+Math.sin(T*2.4)*.12);
  pad.rotation.z-=.004;
  matGold.emissiveIntensity=1.8+Math.sin(T*2.2)*.35;
  matTurq.emissiveIntensity=1.8+Math.sin(T*2.2+1.1)*.35;
  var w=worlds[tier];
  if(w)w.children.forEach(function(o){
    if(o.userData.spin)o.rotation.z+=o.userData.spin;
    if(o.userData.breathe)o.scale.setScalar(1+Math.sin(T*.55)*.055);
    if(o.userData.wave)o.position.y=-.85+Math.sin(T*.55)*.22;
    if(o.userData.pulse)o.intensity=9+Math.sin(T*3.1)*4.5;
    if(o.children&&o.children.length)o.children.forEach(function(ch){
      if(ch.userData.twinkle)ch.material.opacity=.82+Math.sin(T*1.3+ch.id)*.13;});
  });

  bcast+=dt;
  if(bcast>.1){bcast=0;
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({topic:'realtime:pmk',event:'broadcast',
      payload:{event:'mv',payload:{id:myId,n:myName,x:me.position.x,z:me.position.z,r:me.rotation.y,t:tier}},ref:'m'}));}

  rend.render(scene,cam);
}
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});
loop();
setTimeout(function(){document.getElementById('boot').style.display='none';
  toast('Drag to look · joystick to walk');},900);
</script></body></html>
