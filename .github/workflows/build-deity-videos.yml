name: build-deity-videos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Build narrated videos
        run: python3 courses/media/build_videos.py
      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/media/videos
          git diff --cached --quiet || git commit -m "Build narrated deity videos"
          git push
